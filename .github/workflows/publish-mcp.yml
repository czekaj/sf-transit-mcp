name: Publish to official MCP Registry
run-name: MCP Registry ${{ inputs.version }} (publish=${{ inputs.approve_publication }})

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Full 40-character commit SHA reviewed and approved by Lucas
        required: true
        type: string
      version:
        description: Exact server.json version reviewed for this run
        required: true
        type: string
      approve_publication:
        description: Publish public CC0 metadata under the Registry terms (requires Lucas's explicit approval)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: official-mcp-registry
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      APPROVED_VERSION: ${{ inputs.version }}
    steps:
      - name: Require the owner and the exact reviewed main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "czekaj/sf-transit-mcp"
          test "$GITHUB_ACTOR" = "czekaj"
          test "$GITHUB_TRIGGERING_ACTOR" = "czekaj"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run registry:check
      - name: Check the approved version and show the public manifest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFileSync, readFileSync } from "node:fs";
          const manifest = readFileSync("server.json", "utf8");
          assert.equal(JSON.parse(manifest).version, process.env.APPROVED_VERSION);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Reviewed commit: ${process.env.GITHUB_SHA}\n\nPublic manifest:\n\n\`\`\`json\n${manifest}\`\`\`\n`);
          NODE

  publish:
    needs: validate
    if: ${{ inputs.approve_publication }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install the pinned publisher and verify its checksum
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          printf '%s  %s\n' \
            '00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579' \
            "$RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Authenticate with short-lived GitHub identity
        id: login
        shell: bash
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc --registry=https://registry.modelcontextprotocol.io'
      - name: Publish the reviewed manifest
        shell: bash
        run: '"$RUNNER_TEMP/mcp-publisher" publish server.json'
      - name: Remove the publisher credential
        if: ${{ always() && steps.login.outcome == 'success' }}
        shell: bash
        run: '"$RUNNER_TEMP/mcp-publisher" logout'
